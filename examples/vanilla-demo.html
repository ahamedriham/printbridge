<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PrintBridge demo</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; } h2 { font-size: 15px; margin-top: 24px; }
  button { font: inherit; padding: 6px 12px; margin: 2px; }
  select, input, textarea { font: inherit; padding: 4px; }
  textarea { width: 100%; height: 120px; }
  #log { background: #111; color: #9f9; font: 12px monospace; padding: 8px; height: 180px; overflow: auto; white-space: pre-wrap; }
  .ok { color: #137333 } .err { color: #c5221f }
</style>
</head>
<body>
<h1>PrintBridge demo</h1>
<p>Status: <b id="st">disconnected</b> <button id="connect">Connect</button></p>

<h2>Printer</h2>
<select id="printer"></select> <button id="refresh">Refresh</button>

<h2>Raw / ESC-POS receipt</h2>
<button id="receipt">Print sample receipt</button>
<button id="drawer">Open cash drawer</button>
<p>Network printer: <input id="ip" placeholder="192.168.1.50" size="14"> <button id="netReceipt">Print via TCP 9100</button></p>

<h2>HTML</h2>
<textarea id="html"><div style="font-family:sans-serif;width:72mm">
<h2 style="margin:0">Silky Store</h2>
<p>Invoice #1001<br>2x Coffee ....... 20.00 SAR<br>VAT 15% ......... 3.00 SAR<br><b>Total 23.00 SAR</b></p>
</div></textarea>
<br><label>Width mm <input id="w" value="80" size="3"></label> <label>Height mm <input id="h" value="200" size="3"></label>
<button id="printHtml">Print HTML</button> <button id="printHtmlPdf">Print HTML via PDF</button>

<h2>PDF</h2>
<input type="file" id="pdfFile" accept="application/pdf"> <button id="printPdf">Print PDF</button>

<h2>Serial</h2>
<select id="ports"></select> <button id="listPorts">List ports</button> <button id="openPort">Open 9600</button> <button id="closePort">Close</button>
<input id="serialOut" placeholder="text to send"> <button id="sendSerial">Send</button>

<h2>Log</h2>
<div id="log"></div>

<script src="./printbridge.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const log = (m, cls) => { const d = document.createElement('div'); d.className = cls || ''; d.textContent = `${new Date().toLocaleTimeString()} ${m}`; $('#log').prepend(d); };
const run = (fn) => fn().then((r) => log('OK ' + JSON.stringify(r), 'ok')).catch((e) => log('ERR ' + e.message, 'err'));
const printer = () => $('#printer').value;

PrintBridge.on('connect', () => { $('#st').textContent = 'connected'; refresh(); });
PrintBridge.on('disconnect', () => { $('#st').textContent = 'disconnected'; });
PrintBridge.serial.onData((m) => log(`serial ${m.port}: ${m.data}`));

async function refresh() {
  const ps = await PrintBridge.printers.list();
  $('#printer').innerHTML = ps.map((p) => `<option ${p.isDefault ? 'selected' : ''}>${p.name}</option>`).join('');
}

$('#connect').onclick = () => run(() => PrintBridge.connect());
$('#refresh').onclick = () => run(refresh);

const receipt = () => PrintBridge.escpos().init().align('center').size(2, 2).line('SILKY STORE').size(1, 1)
  .line('Riyadh, KSA').line('----------------------------------------')
  .align('left').row('2x Coffee', '20.00').row('VAT 15%', '3.00').bold(true).row('TOTAL', '23.00 SAR').bold(false)
  .align('center').qr('https://example.com/inv/1001', 6).feed(1).line('Thank you').feed(3).cut().toString();

$('#receipt').onclick = () => run(() => PrintBridge.print(PrintBridge.config(printer()), [receipt()]));
$('#drawer').onclick = () => run(() => PrintBridge.print(PrintBridge.config(printer()), [PrintBridge.escpos().drawer().toString()]));
$('#netReceipt').onclick = () => run(() => PrintBridge.print(PrintBridge.config({ host: $('#ip').value, port: 9100 }), [receipt()]));

const htmlCfg = (extra) => PrintBridge.config(printer(), { size: { width: +$('#w').value, height: +$('#h').value }, units: 'mm', margins: 0, ...extra });
$('#printHtml').onclick = () => run(() => PrintBridge.print(htmlCfg(), [{ type: 'pixel', format: 'html', flavor: 'plain', data: $('#html').value }]));
$('#printHtmlPdf').onclick = () => run(() => PrintBridge.print(htmlCfg({ via: 'pdf' }), [{ type: 'pixel', format: 'html', flavor: 'plain', data: $('#html').value }]));

$('#printPdf').onclick = () => run(async () => {
  const f = $('#pdfFile').files[0]; if (!f) throw new Error('Choose a PDF');
  const b64 = btoa(String.fromCharCode(...new Uint8Array(await f.arrayBuffer())));
  return PrintBridge.print(PrintBridge.config(printer()), [{ type: 'pixel', format: 'pdf', flavor: 'base64', data: b64 }]);
});

$('#listPorts').onclick = () => run(async () => { const ps = await PrintBridge.serial.findPorts(); $('#ports').innerHTML = ps.map((p) => `<option value="${p.path}">${p.friendlyName}</option>`).join(''); return ps.length + ' ports'; });
$('#openPort').onclick = () => run(() => PrintBridge.serial.open($('#ports').value, { baudRate: 9600, end: '\n' }));
$('#closePort').onclick = () => run(() => PrintBridge.serial.close($('#ports').value));
$('#sendSerial').onclick = () => run(() => PrintBridge.serial.write($('#ports').value, $('#serialOut').value + '\n'));

PrintBridge.connect().then(() => log('connected', 'ok')).catch((e) => log(e.message, 'err'));
</script>
</body>
</html>
